[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "literary-clock"
version = "0.1.0"
description = "Corpus and selection engine for a literary clock"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "literary-clock contributors" }]
dependencies = [
    "mwparserfromhell>=0.7,<1",
    "pillow>=11.0,<13",
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
litclock = "litclock.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/litclock"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
